<!DOCTYPE html>
<html class="light" lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>EduGuide — So sánh 2 phương án</title>
  <style>
    html, body { background:#f8f9ff; color:#0b1c30; font-family:'Inter',system-ui,-apple-system,sans-serif; margin:0; }
    @view-transition { navigation: auto; }
    ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.15s; animation-timing-function: ease-out; }
    #sidebarMount, header { view-transition-name: none; }
  </style>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="auth.js"></script>
  <script src="sidebar-init.js"></script>
  <script defer src="scroll-helpers.js?v=v2"></script>
  <script defer src="ajax-nav.js?v=2"></script>
  <style>
    .msym { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; vertical-align:middle; }
    body { font-family:'Inter',sans-serif; }
    .pri-grad { background: linear-gradient(135deg,#1a146b 0%,#312e81 100%); }
    @keyframes spin { to { transform:rotate(360deg); } }
    .spin { animation:spin .8s linear infinite; display:inline-block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation:fadeIn .25s ease both; }
    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-thumb { background:#c1c6d6; border-radius:10px; }

    .scenario-A { border-color: #c4b5fd; }
    .scenario-B { border-color: #6ee7b7; }
    .scenario-A-bg { background: linear-gradient(135deg,#8b5cf6 0%,#7c3aed 100%); }
    .scenario-B-bg { background: linear-gradient(135deg,#10b981 0%,#059669 100%); }
  </style>
  <script>
    tailwind.config = { darkMode:'class', theme:{ extend:{ colors:{
      primary:'#1a146b','on-surface':'#0f172a',outline:'#94a3b8',
    }}}}
  </script>
</head>
<body class="bg-[#eff4ff] text-[#0f172a] antialiased">

<!-- Tailwind safelist (dynamic colors used by JS) -->
<div class="hidden" aria-hidden="true">
  <span class="bg-amber-50 bg-amber-100 bg-amber-500 text-amber-700 border-amber-200"></span>
  <span class="bg-[#eef2ff] bg-[#e5eeff] bg-[#eef2ff]0 text-[#1a146b] border-indigo-200"></span>
  <span class="bg-violet-50 bg-violet-100 bg-violet-500 text-violet-700 border-violet-200"></span>
  <span class="bg-[#dcfce7] bg-emerald-100 bg-[#dcfce7]0 text-emerald-700 border-[#86efac]"></span>
  <span class="bg-rose-50 bg-rose-100 bg-rose-500 text-rose-700 border-rose-200"></span>
  <span class="bg-cyan-50 bg-cyan-100 bg-cyan-500 text-cyan-700 border-cyan-200"></span>
  <span class="bg-blue-50 bg-blue-100 bg-blue-500 text-blue-700 border-blue-200"></span>
</div>

<div id="toastContainer" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>
<div id="sidebarMount"></div>

<header class="fixed top-0 left-0 lg:left-60 right-0 h-[60px] bg-white border-b border-[#c8c5d3] flex items-center justify-between px-4 lg:px-6 z-40">
  <div class="flex items-center gap-3 min-w-0">
    <button onclick="toggleSidebar()" class="lg:hidden p-1.5 rounded-lg hover:bg-[#eef2ff] transition-colors">
      <span class="material-symbols-outlined msym text-xl text-[#474651]">menu</span>
    </button>
    <h2 class="text-base font-bold text-[#191c1d] truncate">So sánh 2 phương án</h2>
  </div>
  <div class="flex items-center gap-2">
    <!-- Avatar dropdown -->
    <div class="relative" id="avatarMenu">
      <button onclick="toggleAvatarMenu()" aria-label="Tài khoản"
        class="flex items-center gap-2 pl-1 pr-2 py-1 rounded-full hover:bg-surface-container transition-colors">
        <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center flex-shrink-0">
          <span class="text-on-primary text-xs font-bold" id="topbarAvatar">?</span>
        </div>
        <span class="text-sm font-semibold text-on-surface hidden sm:block max-w-[120px] truncate" id="topbarUserName">...</span>
        <span class="material-symbols-outlined msym text-sm text-on-surface-variant hidden sm:block">expand_more</span>
      </button>
      <div id="avatarDropdown" class="hidden absolute right-0 top-11 w-56 bg-surface-container-lowest rounded-xl shadow-2xl border border-outline-variant z-50">
        <div class="px-4 py-3 border-b border-outline-variant">
          <p class="text-sm font-bold text-on-surface truncate" id="avatarDropName">...</p>
          <p class="text-xs text-outline mt-0.5" id="avatarDropRole">Sinh viên</p>
        </div>
        <div class="py-1">
          <a href="settings.html" class="flex items-center gap-3 px-4 py-2.5 text-sm text-on-surface hover:bg-surface-container transition-colors">
            <span class="material-symbols-outlined msym text-lg text-on-surface-variant">settings</span>
            Cài đặt tài khoản
          </a>
          <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-error hover:bg-error-container transition-colors rounded-b-xl">
            <span class="material-symbols-outlined msym text-lg">logout</span>
            Đăng xuất
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="lg:ml-60 pt-[60px]">
  <div class="p-4 lg:p-6 max-w-6xl mx-auto space-y-5">

    <!-- Intro -->
    <div class="bg-gradient-to-br from-indigo-500 to-violet-600 rounded-2xl text-white p-6 shadow-md">
      <div class="flex items-center gap-4 flex-wrap">
        <div class="w-14 h-14 rounded-2xl bg-white/20 flex items-center justify-center flex-shrink-0">
          <span class="material-symbols-outlined msym text-3xl text-white" style="font-variation-settings:'FILL' 1">compare_arrows</span>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-[10px] uppercase tracking-wider text-indigo-100 font-bold">What-if Comparison</p>
          <h1 class="text-xl lg:text-2xl font-bold mt-1">So sánh 2 hướng đi cá nhân</h1>
          <p class="text-sm text-indigo-100 mt-1">Chọn 2 cấu hình (career + tốc độ học) → hệ thống đưa ra phân tích so sánh.</p>
        </div>
      </div>
    </div>

    <!-- Scenarios input -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-[#ffffff] rounded-2xl border-2 scenario-A p-5 shadow-sm">
        <div class="flex items-center gap-3 mb-4">
          <div class="w-10 h-10 rounded-xl scenario-A-bg flex items-center justify-center text-white font-extrabold flex-shrink-0">A</div>
          <p class="text-base font-bold text-[#0b1c30]">Phương án A</p>
        </div>
        <label class="block mb-3">
          <span class="text-[11px] font-bold uppercase tracking-wider text-[#474651] mb-1 block">Hướng nghề</span>
          <select id="cmpAcareer" class="w-full border border-[#c8c5d3] rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500/20">
            <option value="">— Chọn nghề —</option>
          </select>
        </label>
        <label class="block">
          <div class="flex items-baseline justify-between mb-1">
            <span class="text-[11px] font-bold uppercase tracking-wider text-[#474651]">Tốc độ học</span>
            <span class="text-sm font-bold text-violet-600"><span id="cmpAtcLabel">18</span> TC/kỳ</span>
          </div>
          <input type="range" id="cmpAtc" min="12" max="25" value="18" step="1"
            class="w-full accent-violet-600"
            oninput="document.getElementById('cmpAtcLabel').textContent = this.value"/>
          <div class="flex justify-between text-[9px] text-[#777682] mt-0.5">
            <span>12 (nhẹ)</span><span>18 (vừa)</span><span>25 (max)</span>
          </div>
        </label>
      </div>

      <div class="bg-[#ffffff] rounded-2xl border-2 scenario-B p-5 shadow-sm">
        <div class="flex items-center gap-3 mb-4">
          <div class="w-10 h-10 rounded-xl scenario-B-bg flex items-center justify-center text-white font-extrabold flex-shrink-0">B</div>
          <p class="text-base font-bold text-[#0b1c30]">Phương án B</p>
        </div>
        <label class="block mb-3">
          <span class="text-[11px] font-bold uppercase tracking-wider text-[#474651] mb-1 block">Hướng nghề</span>
          <select id="cmpBcareer" class="w-full border border-[#c8c5d3] rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20">
            <option value="">— Chọn nghề —</option>
          </select>
        </label>
        <label class="block">
          <div class="flex items-baseline justify-between mb-1">
            <span class="text-[11px] font-bold uppercase tracking-wider text-[#474651]">Tốc độ học</span>
            <span class="text-sm font-bold text-[#006c49]"><span id="cmpBtcLabel">22</span> TC/kỳ</span>
          </div>
          <input type="range" id="cmpBtc" min="12" max="25" value="22" step="1"
            class="w-full accent-emerald-600"
            oninput="document.getElementById('cmpBtcLabel').textContent = this.value"/>
          <div class="flex justify-between text-[9px] text-[#777682] mt-0.5">
            <span>12 (nhẹ)</span><span>18 (vừa)</span><span>25 (max)</span>
          </div>
        </label>
      </div>
    </div>

    <div class="text-center">
      <button onclick="_runCompare()" id="cmpRunBtn"
        class="pri-grad text-white px-6 py-3 rounded-xl text-sm font-bold shadow hover:opacity-90 transition-all flex items-center gap-2 mx-auto">
        <span class="material-symbols-outlined msym text-base">compare_arrows</span>So sánh ngay
      </button>
    </div>

    <!-- Result -->
    <div id="cmpResult" class="hidden space-y-5 fade-in">

      <!-- Winner banner -->
      <div id="cmpWinnerBanner" class="rounded-2xl p-5 shadow-md text-white"></div>

      <!-- Side-by-side metrics -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div id="cmpResultA" class="bg-[#ffffff] rounded-2xl border-2 scenario-A overflow-hidden"></div>
        <div id="cmpResultB" class="bg-[#ffffff] rounded-2xl border-2 scenario-B overflow-hidden"></div>
      </div>

      <!-- Advice -->
      <div id="cmpAdvice" class="bg-[#ffffff] rounded-2xl border border-[#c8c5d3] p-5 shadow-sm">
        <div class="flex items-center gap-2 mb-3">
          <span class="material-symbols-outlined msym text-amber-500 text-base">lightbulb</span>
          <h3 class="font-semibold text-sm text-[#0b1c30]">Phân tích so sánh</h3>
        </div>
        <div id="cmpAdviceList" class="space-y-2"></div>
      </div>
    </div>

  </div>
</main>

<script src="floating-chat.js"></script>
<script>
const API = window.API_BASE;
function H(extra={}) { return { Authorization: `Bearer ${getToken()}`, ...extra }; }
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg, type='info', duration=3000) {
  const cls = { success:'bg-[#dcfce7]0', error:'bg-[#ba1a1a]', warning:'bg-amber-500', info:'bg-[#eef2ff]0' };
  const el = document.createElement('div');
  el.className = `pointer-events-auto px-4 py-2.5 ${cls[type]||cls.info} text-white text-sm font-medium rounded-xl shadow-lg fade-in`;
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), duration);
}

let _careers = [];

checkAuth();

(async function init() {
  try {
    const ur = await fetch(`${API}/auth/me`, { headers: H() });
    if (ur.ok) {
      const u = await ur.json();
      updateTopbarUser(u);
    }
  } catch {}
  // Load career options
  try {
    const res = await fetch(`${API}/careers`);
    if (res.ok) _careers = await res.json();
  } catch {}
  _populateCareerOptions();
})();

function _populateCareerOptions() {
  const opts = ['<option value="">— Chọn nghề —</option>']
    .concat(_careers.map(c => `<option value="${escHtml(c.code)}">${escHtml(c.name)}</option>`))
    .join('');
  document.getElementById('cmpAcareer').innerHTML = opts;
  document.getElementById('cmpBcareer').innerHTML = opts;
}

async function _runCompare() {
  const aCareer = document.getElementById('cmpAcareer').value;
  const bCareer = document.getElementById('cmpBcareer').value;
  const aTC = parseInt(document.getElementById('cmpAtc').value) || 18;
  const bTC = parseInt(document.getElementById('cmpBtc').value) || 22;
  if (!aCareer || !bCareer) { showToast('Vui lòng chọn nghề cho cả 2 phương án', 'warning'); return; }

  const btn = document.getElementById('cmpRunBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-outlined msym text-base spin">progress_activity</span>Đang phân tích...';

  try {
    const res = await fetch(`${API}/me/compare-scenarios`, {
      method: 'POST', headers: H({ 'Content-Type':'application/json' }),
      body: JSON.stringify({
        scenario_a: { career_code: aCareer, credits_per_term: aTC },
        scenario_b: { career_code: bCareer, credits_per_term: bTC },
      }),
    });
    btn.disabled = false;
    btn.innerHTML = '<span class="material-symbols-outlined msym text-base">compare_arrows</span>So sánh ngay';
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showToast(err.detail || 'Lỗi phân tích', 'error');
      return;
    }
    const data = await res.json();
    _renderResult(data);
  } catch (e) {
    btn.disabled = false;
    btn.innerHTML = '<span class="material-symbols-outlined msym text-base">compare_arrows</span>So sánh ngay';
    showToast('Lỗi: ' + e.message, 'error');
  }
}

function _renderResult(d) {
  document.getElementById('cmpResult').classList.remove('hidden');
  // Winner banner with "Đặt làm hướng chính" CTA when A or B wins
  const banner = document.getElementById('cmpWinnerBanner');
  const winnerScenario = d.winner === 'A' ? d.scenario_a : (d.winner === 'B' ? d.scenario_b : null);
  const winnerCode = winnerScenario?.career_path?.code || null;
  const winnerName = winnerScenario?.career_path?.name || '';
  const winnerTC = winnerScenario?.credits_per_term || null;
  const ctaBtn = winnerCode ? `
    <button onclick="_applyWinner('${escHtml(winnerCode)}','${escHtml(winnerName)}',${winnerTC || 'null'})"
      id="cmpApplyBtn"
      class="ml-auto inline-flex items-center gap-1.5 px-3 py-2 bg-white text-[#1a146b] hover:bg-[#eef2ff] text-xs font-bold rounded-lg shadow transition-colors flex-shrink-0">
      <span class="material-symbols-outlined msym text-base">rocket_launch</span>Áp dụng phương án này
    </button>` : '';
  if (d.winner === 'A') {
    banner.className = 'rounded-2xl p-5 shadow-md text-white scenario-A-bg';
    banner.innerHTML = `<div class="flex items-center gap-3 flex-wrap">
      <span class="material-symbols-outlined msym text-2xl" style="font-variation-settings:'FILL' 1">emoji_events</span>
      <div class="flex-1 min-w-0"><p class="text-[10px] uppercase tracking-wider text-white/70 font-bold">Khuyến nghị</p>
      <p class="text-base font-bold">Phương án A có vẻ phù hợp hơn cho bạn</p></div>
      ${ctaBtn}
    </div>`;
  } else if (d.winner === 'B') {
    banner.className = 'rounded-2xl p-5 shadow-md text-white scenario-B-bg';
    banner.innerHTML = `<div class="flex items-center gap-3 flex-wrap">
      <span class="material-symbols-outlined msym text-2xl" style="font-variation-settings:'FILL' 1">emoji_events</span>
      <div class="flex-1 min-w-0"><p class="text-[10px] uppercase tracking-wider text-white/70 font-bold">Khuyến nghị</p>
      <p class="text-base font-bold">Phương án B có vẻ phù hợp hơn cho bạn</p></div>
      ${ctaBtn}
    </div>`;
  } else {
    banner.className = 'rounded-2xl p-5 shadow-md text-white pri-grad';
    banner.innerHTML = `<div class="flex items-center gap-3">
      <span class="material-symbols-outlined msym text-2xl">balance</span>
      <div><p class="text-[10px] uppercase tracking-wider text-white/70 font-bold">Kết quả</p>
      <p class="text-base font-bold">2 phương án ngang ngửa — cân nhắc theo sở thích cá nhân</p></div>
    </div>`;
  }

  document.getElementById('cmpResultA').innerHTML = _scenarioCard('A', d.scenario_a, d.winner === 'A');
  document.getElementById('cmpResultB').innerHTML = _scenarioCard('B', d.scenario_b, d.winner === 'B');

  // Advice
  const advList = d.advice || [];
  const advEl = document.getElementById('cmpAdviceList');
  if (advList.length === 0) {
    advEl.innerHTML = '<p class="text-xs text-[#777682] italic">2 phương án rất tương đương ở các metric chính.</p>';
  } else {
    advEl.innerHTML = advList.map(a => `<div class="flex items-start gap-2 px-3 py-2 bg-amber-50 border border-amber-200 rounded-lg text-sm">
      <span class="material-symbols-outlined msym text-amber-600 text-base flex-shrink-0">${escHtml(a.icon || 'lightbulb')}</span>
      <div class="flex-1">
        <p class="font-semibold text-amber-800">${escHtml(a.label)}</p>
        ${a.detail ? `<p class="text-xs text-amber-700">${escHtml(a.detail)}</p>` : ''}
      </div>
    </div>`).join('');
  }
}

async function _applyWinner(code, name, creditsPerTerm) {
  // Confirmation: explain what will happen
  const tcLine = creditsPerTerm ? `\n• Tốc độ học: ${creditsPerTerm} TC/kỳ (cập nhật vào hồ sơ → ảnh hưởng max TC khi lập lộ trình)` : '';
  const ok = confirm(`Áp dụng phương án này sẽ thực hiện đồng thời:\n\n• Đặt "${name}" làm hướng nghề chính → ML rec sẽ ưu tiên môn dạy skill nghề này${tcLine}\n• Refresh recommendation kỳ tới theo cấu hình mới\n\nTiếp tục?`);
  if (!ok) return;

  const btn = document.getElementById('cmpApplyBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="material-symbols-outlined msym text-base spin">progress_activity</span>Đang áp dụng...'; }

  // Run both updates in parallel — best effort (one failure doesn't block the other)
  const calls = [
    fetch(`${API}/careers/me/choose`, {
      method: 'POST', headers: H({ 'Content-Type':'application/json' }),
      body: JSON.stringify({ code, slot: 'primary' }),
    }),
  ];
  if (creditsPerTerm) {
    calls.push(fetch(`${API}/profile/me`, {
      method: 'PATCH', headers: H({ 'Content-Type':'application/json' }),
      body: JSON.stringify({ max_credits_per_term: creditsPerTerm }),
    }));
  }

  let careerOk = false, paceOk = !creditsPerTerm;  // pace always OK if not set
  try {
    const results = await Promise.allSettled(calls);
    careerOk = results[0].status === 'fulfilled' && results[0].value.ok;
    if (creditsPerTerm) {
      paceOk = results[1].status === 'fulfilled' && results[1].value.ok;
    }
  } catch {}

  if (!careerOk) {
    showToast('Lỗi đặt hướng chính', 'error');
    if (btn) { btn.disabled = false; btn.innerHTML = '<span class="material-symbols-outlined msym text-base">rocket_launch</span>Áp dụng phương án này'; }
    return;
  }

  // Success: replace button with multi-action panel showing what changed + where to verify
  const banner = document.getElementById('cmpWinnerBanner');
  if (banner) {
    const tcMsg = creditsPerTerm ? (paceOk ? `<span>· Tốc độ ${creditsPerTerm} TC/kỳ <strong>đã lưu</strong></span>` : `<span>· (lưu tốc độ thất bại — đổi tay ở Cài đặt)</span>`) : '';
    banner.innerHTML = `<div class="flex items-start gap-3 flex-wrap">
      <span class="material-symbols-outlined msym text-2xl flex-shrink-0" style="font-variation-settings:'FILL' 1">verified</span>
      <div class="flex-1 min-w-0">
        <p class="text-[10px] uppercase tracking-wider text-white/70 font-bold">Đã áp dụng</p>
        <p class="text-base font-bold">"${escHtml(name)}" giờ là hướng chính của bạn ${tcMsg}</p>
        <p class="text-xs text-white/85 mt-1">Hệ thống đã cập nhật profile. Vào các trang sau để thấy kết quả ngay:</p>
        <div class="mt-2 flex flex-wrap gap-2">
          <a href="home.html" class="text-[11px] bg-white/20 hover:bg-white/30 backdrop-blur text-white font-semibold px-2.5 py-1 rounded-md flex items-center gap-1 transition-colors">
            <span class="material-symbols-outlined msym text-[14px]">home</span>Tổng quan (gợi ý kỳ tới đã refresh)
          </a>
          <a href="roadmap.html" class="text-[11px] bg-white/20 hover:bg-white/30 backdrop-blur text-white font-semibold px-2.5 py-1 rounded-md flex items-center gap-1 transition-colors">
            <span class="material-symbols-outlined msym text-[14px]">route</span>Lộ trình (TC/kỳ mới)
          </a>
          <a href="skill-tree.html" class="text-[11px] bg-white/20 hover:bg-white/30 backdrop-blur text-white font-semibold px-2.5 py-1 rounded-md flex items-center gap-1 transition-colors">
            <span class="material-symbols-outlined msym text-[14px]">account_tree</span>Skill tree cho hướng này
          </a>
        </div>
      </div>
    </div>`;
  }
  showToast(`Đã áp dụng "${name}" và refresh hệ thống`, 'success');
}

function _scenarioCard(label, s, isWinner) {
  const path = s.career_path || {};
  const fitColor = (s.fit_score || 0) >= 70 ? 'emerald' : (s.fit_score || 0) >= 50 ? 'amber' : 'rose';
  const headBg = label === 'A' ? 'scenario-A-bg' : 'scenario-B-bg';
  const recList = (s.recommended_courses || []).slice(0, 5);

  return `
  <div class="${headBg} text-white px-5 py-4">
    <div class="flex items-center gap-3 flex-wrap">
      <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center font-extrabold text-lg flex-shrink-0">${label}</div>
      <div class="flex-1 min-w-0">
        <p class="text-[10px] uppercase tracking-wider text-white/70 font-bold">${escHtml(path.name || '—')}</p>
        <p class="text-base font-bold leading-tight">${s.credits_per_term} TC/kỳ</p>
      </div>
      ${isWinner ? '<span class="material-symbols-outlined msym text-2xl" style="font-variation-settings:&#39;FILL&#39; 1">emoji_events</span>' : ''}
    </div>
  </div>
  <div class="p-5 space-y-4">

    <!-- 4 stats grid -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-[#eff4ff] rounded-lg p-3">
        <p class="text-[10px] uppercase tracking-wider text-[#777682] font-bold">Phù hợp</p>
        <p class="text-2xl font-extrabold text-${fitColor}-600">${s.fit_score != null ? s.fit_score.toFixed(1) + '%' : '—'}</p>
      </div>
      <div class="bg-[#eff4ff] rounded-lg p-3">
        <p class="text-[10px] uppercase tracking-wider text-[#777682] font-bold">Kỳ đến TN</p>
        <p class="text-2xl font-extrabold text-[#1a146b]">${s.terms_to_graduate != null ? '~' + s.terms_to_graduate.toFixed(1) : '—'}</p>
      </div>
      <div class="bg-[#eff4ff] rounded-lg p-3">
        <p class="text-[10px] uppercase tracking-wider text-[#777682] font-bold">Skill phủ</p>
        <p class="text-2xl font-extrabold text-[#006c49]">${s.skill_summary.coverage_percent}%</p>
        <p class="text-[10px] text-[#777682]">${s.skill_summary.mastered}/${s.skill_summary.total} mastered</p>
      </div>
      <div class="bg-[#eff4ff] rounded-lg p-3">
        <p class="text-[10px] uppercase tracking-wider text-[#777682] font-bold">Skill thiếu</p>
        <p class="text-2xl font-extrabold text-rose-600">${s.skill_summary.missing}</p>
        <p class="text-[10px] text-[#777682]">cần học thêm</p>
      </div>
    </div>

    <!-- Difficulty -->
    <div class="bg-${s.difficulty.color}-50 border border-${s.difficulty.color}-200 rounded-lg px-3 py-2 flex items-start gap-2">
      <span class="material-symbols-outlined msym text-${s.difficulty.color}-600 text-base flex-shrink-0">speed</span>
      <div class="flex-1">
        <p class="text-sm font-bold text-${s.difficulty.color}-800">${escHtml(s.difficulty.label)}</p>
        <p class="text-xs text-${s.difficulty.color}-700">${escHtml(s.difficulty.message)}</p>
      </div>
    </div>

    <!-- Recommended courses to fill gap -->
    ${recList.length > 0 ? `
    <div>
      <p class="text-[11px] font-bold uppercase tracking-wider text-[#474651] mb-2">Top môn lấp gap</p>
      <div class="space-y-1">
        ${recList.map(c => `<a href="course-detail.html?code=${encodeURIComponent(c.course_code)}"
          class="block bg-[#eff4ff] hover:bg-[#eef2ff] transition-colors rounded-lg px-3 py-2 text-xs flex items-center gap-2">
          <span class="material-symbols-outlined msym text-[#777682] text-base">menu_book</span>
          <span class="font-mono font-bold text-[#1a146b] flex-shrink-0">${escHtml(c.course_code)}</span>
          <span class="flex-1 text-[#0b1c30] truncate">${escHtml(c.course_name)}</span>
          <span class="text-[10px] text-[#006c49] font-bold">+${c.matched}</span>
        </a>`).join('')}
      </div>
    </div>` : ''}
  </div>`;
}
</script>
</body>
</html>
